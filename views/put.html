<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado productos</title>
    <link rel='stylesheet' href='https://cdn.jsdelivr.net/gh/kognise/water.css@latest/dist/dark.css'>

    <!-- CSS externo -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div id="logo-container">
            <img src="https://img.magnific.com/premium-vector/simple-burger-logo-design_375081-575.jpg?w=740" alt="logo" class="logo">
        </div>
        <nav>
            <ul>
                <li>
                    <a href="index.html">Principal</a>
                </li>
                <li>
                    <a href="get.html">Consultar</a>
                </li>
                <li>
                    <a href="post.html">Crear</a>
                </li>
                <li>
                    <a href="put.html">Modificar</a>
                </li>
                <li>
                    <a href="delete.html">Eliminar</a>
                </li>
            </ul>
        </nav>
    </header>
    
    <main>
        <h1>Consultar producto por id</h1>

        <!-- Formulario para obtener producto por id -->
        <form id="getProduct-form">
            <label for="idProd">Id del producto</label>
            <input type="number" name="idProd" id="idProd" required>

            <input type="submit" value="Consultar producto">
        </form>


        <section id="contenedor-productos"></section>

        <section id="contenedor-formulario"></section>
    </main>



    <script>
        let getProductform = document.getElementById("getProduct-form");
        let contenedorProductos = document.getElementById("contenedor-productos");
        let contenedorFormulario = document.getElementById("contenedor-formulario");

        // Manejamos el evento de envio del formulario
        getProductform.addEventListener("submit", async event => {
            event.preventDefault();

            // En lugar de guardar la informacion de este formulario en un objeto FormData, directamente, al ser solo un id, extraigo este valor
            // Saltamos el FormData + Object.fromEntries y extraemos de una el id del producto
            const idProd = event.target.idProd.value.trim();

            const urlBase = "http://localhost:3000/api/products";
            
            // Vamos a realizar la solicitud HTTP con la API fetch
            try {
                const response = await fetch(`${urlBase}/${idProd}`);
                console.log(response);

                // Procesamos los datos que devuelve el servidor
                const datos = await response.json();
                const producto = datos.payload;
                console.log(producto); // {id: 3, name: 'la macpollo', image: 'https://www.mostazaweb.com.ar/wp-content/uploads/2025/05/MAYMesa-de-trabajo-2.png', category: 'food', price: '199.00', …}

                // Recibido el producto lo renderizo en la pantalla
                renderizarProducto(producto); // Aca le mando un objeto, en lugar de un array de objetos como pasa en index.html



            } catch (error) {
                console.error("Error al obtener producto");

                // mostrarError(error.message);
            }
        });

        function renderizarProducto(producto) {
        
            let htmlProducto = "";
            htmlProducto += `
            <ul>
                <li class="lista-producto">
                    <img src="${producto.image}" alt="${producto.name}" class="logo">
                    <p>Id: ${producto.id} / Nombre: ${producto.name} / <strong>$${producto.price}</strong></p>
                </li>
                <li class="lista-btn">
                    <input type="button" id="updateProduct-button" value="Actualizar producto">
                </li>
            </ul>`;
            

            contenedorProductos.innerHTML = htmlProducto;

            const updateProductButton = document.getElementById("updateProduct-button");
            updateProductButton.addEventListener("click", event => {
                generarFormularioProducto(event, producto);
            });


            function generarFormularioProducto(event, producto) {
                event.stopPropagation();

                console.table(producto);

                let updateProductForm = `
                <h2>Actualizar producto</h2>
                <form id="updateProducts-form">

                    <label for="idProd">Id</label>
                    <input type="number" name="id" id="idProd" value="${producto.id}" readonly>

                    <label for="categoryProd">Categoria</label>
                    <select name="category" id="categoryProd" required>
                        <option value="food">food</option>
                        <option value="drink">drink</option>
                    </select>


                    <label for="imageProd">Imagen</label>
                    <input type="text" name="image" id="imageProd" value="${producto.image}" required>


                    <label for="nameProd">Nombre</label>
                    <input type="text" name="name" id="nameProd" value="${producto.name}" required>


                    <label for="priceProd">Precio</label>
                    <input type="number" name="price" id="priceProd" value="${producto.price}" required>


                    <input type="submit" value="Actualizar producto">
                </form>
                `;

                contenedorFormulario.innerHTML = updateProductForm;

                const updateProductsForm = document.getElementById("updateProducts-form");
                updateProductsForm.addEventListener("submit", event => {
                    actualizarProducto(event);
                });
            }

            async function actualizarProducto(event) {
                event.preventDefault();

                const urlBase = "http://localhost:3000";
                const formData = new FormData(event.target);
                const data = Object.fromEntries(formData.entries());
                console.table(data);

                try {
                    const response = await fetch(`${urlBase}/api/products`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();
                    
                    if(response.ok) {
                        console.log(response);

                        console.log(result.message);
                        alert(result.message);

                        // Limpiamos visualmente la pantalla
                        contenedorProductos.innerHTML = "";
                        contenedorFormulario.innerHTML = "";

                    } else {
                        console.error("Error al actualizar producto: ", result.message);
                    }

                } catch (error) {
                    console.error("Error al enviar los datos: ", error);
                }
            }
        }
    </script>
</body>
</html>
